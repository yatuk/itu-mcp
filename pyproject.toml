[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itu-mcp"
version = "1.4.0"
description = "MCP server for İTÜ Ninova, OBS, Portal, campus services and library: courses, grades, schedules, planning and more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "yatuk" },
]
keywords = ["mcp", "model-context-protocol", "ninova", "obs", "portal", "library", "campus", "itu", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=6.1.0",
  "mcp>=1.28.1,<2",
  "pypdf>=6.19.0",
  "python-docx>=1.1.0",
  "requests>=2.33.0",
  "starlette>=1.3.1",
  "typing-extensions>=4.9.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
# OS keychain storage for `itu-mcp setup` (Windows Credential Manager,
# macOS Keychain, Secret Service, KWallet).
keyring = ["keyring>=24"]

[project.urls]
Homepage = "https://github.com/yatuk/itu-mcp"
Repository = "https://github.com/yatuk/itu-mcp"
Issues = "https://github.com/yatuk/itu-mcp/issues"

[project.scripts]
itu-mcp = "ninova_mcp.server:main"
itu-mcp-remote = "ninova_mcp.remote:main"
# Back-compat aliases
ninova-mcp = "ninova_mcp.server:main"
ninova-mcp-remote = "ninova_mcp.remote:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
