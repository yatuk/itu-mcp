name: Publish to PyPI

# Every action is pinned to a full commit SHA; the comment after it names the
# release that commit belongs to. A tag or branch can be moved to different
# code later, a commit cannot. Update a pin by resolving the new tag, for
# example: gh api repos/actions/checkout/git/ref/tags/v5.1.0
# See docs/releasing.md.

on:
  release:
    types: [published]
  workflow_dispatch:

# Nothing by default. Each job asks for what it needs.
permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI gives this workflow a short-lived token, so
    # there is no API token stored in the repository. It needs the GitHub
    # publisher registered on PyPI first (owner "yatuk", repository "itu-mcp",
    # workflow "publish.yml", environment empty). docs/releasing.md has the steps.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tools
        # Exact versions: these two build and check the files that are
        # uploaded. Their own dependencies are still resolved at run time.
        run: python -m pip install build==1.6.1 twine==7.0.0

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    # "mcp-publisher login github-oidc" proves the repository identity to the
    # MCP registry with an OIDC token. Only this job can request one.
    permissions:
      contents: read
      id-token: write
    env:
      # Release of https://github.com/modelcontextprotocol/registry and the
      # SHA-256 of its mcp-publisher_linux_amd64.tar.gz asset. Change both
      # together. The digest is the one GitHub reports for the asset:
      #   gh api repos/modelcontextprotocol/registry/releases/tags/v1.8.1 \
      #     --jq '.assets[] | select(.name=="mcp-publisher_linux_amd64.tar.gz") | .digest'
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          # Nothing is unpacked or run unless the checksum matches.
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" mcp-publisher
          sudo install -m 0755 "${RUNNER_TEMP}/mcp-publisher" /usr/local/bin/mcp-publisher

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
