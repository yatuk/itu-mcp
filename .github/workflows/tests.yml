name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run tests
        env:
          NINOVA_USERNAME: dummy
          NINOVA_PASSWORD: dummy
        run: python -m unittest discover -s tests -v

  security:
    name: Dependency and static security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: python -m pip install pip-audit bandit

      - name: Audit resolved project dependencies
        run: python -m pip_audit .

      - name: Scan Python source
        run: python -m bandit -r src/ninova_mcp -q
