name: Tests

# Actions are pinned to full commit SHAs; the trailing comment names the
# release. See docs/releasing.md for how to update a pin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu keeps its old check names; the Windows rows add a suffix.
    name: Test (Python ${{ matrix.python-version }}${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The project ships a Windows bundle, and some failures (a missing
          # tzdata package, path and encoding differences) only show there.
          # Oldest and newest supported Python keep the run time reasonable.
          - os: windows-latest
            python-version: "3.11"
            suffix: ", Windows"
          - os: windows-latest
            python-version: "3.14"
            suffix: ", Windows"
    defaults:
      run:
        # Same shell on both systems, so one command line works everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run tests
        env:
          NINOVA_USERNAME: dummy
          NINOVA_PASSWORD: dummy
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.15,<0.16"

      - name: Check source and tests
        run: python -m ruff check src/ tests/

  security:
    name: Dependency and static security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: python -m pip install pip-audit bandit

      - name: Audit resolved project dependencies
        run: python -m pip_audit .

      - name: Scan Python source
        run: python -m bandit -r src/ninova_mcp -q
