name: Build .mcpb bundles

# Builds the one-click Claude Desktop extension (.mcpb) for every platform.
# Compiled dependencies (lxml, pydantic-core) are platform-specific, so we
# build one bundle per OS/arch. Triggers on a version tag (v*) and attaches
# the bundles to the matching GitHub Release; also runnable on demand.

# Actions are pinned to full commit SHAs; the trailing comment names the
# release. See docs/releasing.md for how to update a pin.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default. The build job installs the dependency tree and runs
# the packer, so it gets no write access. Only the release job can write.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS Apple Silicon
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-latest
            label: Linux x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node (for the mcpb packer)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build .mcpb
        run: python scripts/build_mcpb.py

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpb-${{ matrix.os }}
          path: dist/*.mcpb
          if-no-files-found: error

  release:
    name: Attach bundles to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # attach the bundles to the GitHub Release
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bundles
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: bundles/*.mcpb
          fail_on_unmatched_files: true
